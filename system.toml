# Init programs (run at boot, in order)
#
# sshd is deliberately not here. It is built into the image and started by hand
# (`/bin/sshd &`) on a machine that wants remote access: it listens on every
# interface, so carrying it in every boot is a listening port nobody asked for.
# `src/build.rs`'s `no_shipped_boot_config_starts_sshd` is the gate.
init = [
    "/bin/compositor",
    "/bin/soundd",
    "/bin/netd",
]

hosted-rustc = true
assets = ["assets"]

[programs]
shell = {}
terminal = {}
compositor = {}
soundd = {}
netd = {}
sshd = {}
doom = {}
snake = {}
editor = {}
paint = {}
files = {}
filepicker = {}
toybox = {}
input-test = {}
proctest = {}
toyos-ld = { path = "toyos-ld" }
toyos-cc = { path = "toyos-cc" }
# cargo = { path = "userland/cargo", no-default-features = true }

# Symlinks created in the initrd at build time.
# Paths are relative to the filesystem root (no leading /).
[symlinks]
"bin/cat" = "/bin/toybox"
"bin/cp" = "/bin/toybox"
"bin/echo" = "/bin/toybox"
"bin/free" = "/bin/toybox"
"bin/grep" = "/bin/toybox"
"bin/hexdump" = "/bin/toybox"
"bin/locale" = "/bin/toybox"
"bin/ls" = "/bin/toybox"
"bin/mkdir" = "/bin/toybox"
"bin/mv" = "/bin/toybox"
"bin/net" = "/bin/toybox"
"bin/ps" = "/bin/toybox"
"bin/pwd" = "/bin/toybox"
"bin/rm" = "/bin/toybox"
"bin/screen" = "/bin/toybox"
"bin/shutdown" = "/bin/toybox"
"bin/spin" = "/bin/toybox"
"bin/stats" = "/bin/toybox"
"bin/tone" = "/bin/toybox"

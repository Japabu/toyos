# sshd is deliberately not in `[boot] start`. It is built into the image and
# started by hand (`/bin/sshd &`) on a machine that wants remote access: it
# listens on every interface, so carrying it in every boot is a listening port
# nobody asked for.
# `src/build.rs`'s `no_shipped_boot_config_starts_sshd` is the gate.

hosted-rustc = false

# `assets/soundfont.sf2` is in here and is doom's music: GeneralUser GS cut down
# to the 37 melodic programs and 23 percussion keys `assets/DOOM1.WAD`'s own MUS
# headers select, by `src/soundfont.rs`. `NOTICE` carries its licence and the
# provenance caveat that comes with it; `specs/doom-music-soundfont.md` prices
# the alternatives, including the zero-byte OPL3 path that may one day delete it.
assets = ["assets"]

# What `/bin/init` starts at boot. Program keys, not paths, and the order means
# nothing: every port exists before any server runs.
[boot]
# `filepicker` is here and is **interim**. Its acceptor is init's to hand over,
# and the launcher — which is how the compositor would ask for it — needs handle
# transfer. Starting it at boot is what makes an editor's `pick_file` reach a
# picker instead of queueing on a port nobody accepts from.
start = ["compositor", "soundd", "netd", "filepicker"]

[programs]
input-test = {}
proctest = {}
toyos-ld = { path = "toyos-ld" }
toyos-cc = { path = "toyos-cc" }
# cargo = { path = "userland/cargo", no-default-features = true }

# `compositor` in its own `receives` is **interim**: a terminal or a picker the
# compositor starts inherits the compositor's namespace, and until the launcher
# can build a child's authority from that child's own manifest row there is no
# other way for a compositor-started window client to hold a compositor
# connector. It comes out with the launcher.
[programs.compositor]
serves = ["compositor"]
receives = ["compositor", "soundd", "filepicker", "launcher"]
devices = ["framebuffer", "keyboard", "mouse"]

[programs.soundd]
serves = ["soundd"]
devices = ["hda-audio", "virtio-sound"]
syscap = ["rt"]

[programs.netd]
serves = ["netd"]
devices = ["nic"]

[programs.sshd]
receives = ["netd", "launcher"]

[programs.filepicker]
serves = ["filepicker"]
receives = ["compositor"]

[programs.terminal]
provides = ["surface"]
receives = ["compositor", "launcher"]

[programs.shell]
receives = ["surface", "launcher"]

[programs.doom]
receives = ["compositor", "soundd"]

[programs.snake]
receives = ["compositor", "filepicker"]

[programs.editor]
receives = ["compositor", "filepicker"]

[programs.paint]
receives = ["compositor", "filepicker"]

[programs.files]
receives = ["compositor", "filepicker"]

[programs.toybox]
receives = ["compositor", "soundd", "surface"]

# Symlinks created in the initrd at build time.
# Paths are relative to the filesystem root (no leading /).
[symlinks]
"bin/cat" = "/bin/toybox"
"bin/cp" = "/bin/toybox"
"bin/echo" = "/bin/toybox"
"bin/free" = "/bin/toybox"
"bin/grep" = "/bin/toybox"
"bin/hexdump" = "/bin/toybox"
"bin/locale" = "/bin/toybox"
"bin/ls" = "/bin/toybox"
"bin/mkdir" = "/bin/toybox"
"bin/mv" = "/bin/toybox"
"bin/net" = "/bin/toybox"
"bin/ps" = "/bin/toybox"
"bin/pwd" = "/bin/toybox"
"bin/rm" = "/bin/toybox"
"bin/screen" = "/bin/toybox"
"bin/shutdown" = "/bin/toybox"
"bin/spin" = "/bin/toybox"
"bin/stats" = "/bin/toybox"
"bin/tone" = "/bin/toybox"

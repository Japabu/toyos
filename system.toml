# Init programs (run at boot, in order)
#
# sshd is deliberately not here. It is built into the image and started by hand
# (`/bin/sshd &`) on a machine that wants remote access: it listens on every
# interface, so carrying it in every boot is a listening port nobody asked for.
# `src/build.rs`'s `no_shipped_boot_config_starts_sshd` is the gate.
init = [
    "/bin/compositor",
    "/bin/soundd",
    "/bin/netd",
]

hosted-rustc = false
assets = ["assets"]

# doom's music, and it is opt-in: this repository ships no SoundFont, because
# the one it used to carry (TimGM6mb) is GPL-2.0 and this tree is MIT OR
# Apache-2.0, so an image built with it put copyleft obligations on whoever
# redistributed one. Drop a `.sf2` here under this name and doom plays music;
# leave it out and the build says so by name and doom says so again at startup.
# GeneralUser GS (32,319,396 B) is the recommended one. Its licence is a bespoke
# "License v2.0" by S. Christian Collins, not CC-BY-4.0 as this said until the
# author's own text was read, and he states he cannot be certain of every
# sample's origin — worth knowing before redistributing an image built with it.
# MuseScore_General is the clean-licence alternative (MIT, named copyright
# chain) and is out on size, not on format: its `.sf2` is 215,614,036 B, and the
# 39,900,972 B `.sf3` is Vorbis-compressed, which rustysynth refuses outright.
# `specs/doom-music-soundfont.md` prices every option, including a subset that
# renders bit-exact at 15,546,748 B and a zero-byte OPL3 path.
#
# Named here because a sweep cannot tell an untracked SoundFont from a
# .DS_Store, and only here: this is the only config that builds doom.
untracked-assets = ["soundfont.sf2"]

[programs]
shell = {}
terminal = {}
compositor = {}
soundd = {}
netd = {}
sshd = {}
doom = {}
snake = {}
editor = {}
paint = {}
files = {}
filepicker = {}
toybox = {}
input-test = {}
proctest = {}
toyos-ld = { path = "toyos-ld" }
toyos-cc = { path = "toyos-cc" }
# cargo = { path = "userland/cargo", no-default-features = true }

# Symlinks created in the initrd at build time.
# Paths are relative to the filesystem root (no leading /).
[symlinks]
"bin/cat" = "/bin/toybox"
"bin/cp" = "/bin/toybox"
"bin/echo" = "/bin/toybox"
"bin/free" = "/bin/toybox"
"bin/grep" = "/bin/toybox"
"bin/hexdump" = "/bin/toybox"
"bin/locale" = "/bin/toybox"
"bin/ls" = "/bin/toybox"
"bin/mkdir" = "/bin/toybox"
"bin/mv" = "/bin/toybox"
"bin/net" = "/bin/toybox"
"bin/ps" = "/bin/toybox"
"bin/pwd" = "/bin/toybox"
"bin/rm" = "/bin/toybox"
"bin/screen" = "/bin/toybox"
"bin/shutdown" = "/bin/toybox"
"bin/spin" = "/bin/toybox"
"bin/stats" = "/bin/toybox"
"bin/tone" = "/bin/toybox"

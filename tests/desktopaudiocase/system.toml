# A desktop with a shell and soundd: the T14's shape when #172 wedged it.
#
# `tests/desktopcase` has no daemon behind the shell and `tests/testcases` has
# no desktop in front of it, so the machine where a *shell-spawned* audio client
# meets a null sink existed in neither. That machine is this one: the client's
# stdio are pipes to a terminal, the terminal is a compositor surface, and
# soundd has no device.

assets = ["assets"]

[boot]
start = ["logd", "compositor", "soundd", "terminal"]

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does. The kernel keeps the record ring and writes no file at all, so a
# boot config without `logd` is a boot whose `/log` is empty —
# `every_boot_config_runs_logd` is what refuses one.
# It claims no device and serves no port: its whole authority
# is `logread`, which is `Rights::LOG | Rights::WAIT` on a `SysCap` duplicate.
[programs.logd]
syscap = ["logread"]

[programs.compositor]
serves = ["compositor"]
receives = ["soundd", "launcher"]
devices = ["framebuffer", "keyboard", "mouse"]

[programs.soundd]
serves = ["soundd"]
devices = ["hda-audio", "virtio-sound"]
syscap = ["rt"]

[programs.terminal]
provides = ["surface"]
receives = ["compositor", "launcher"]

[programs.shell]
receives = ["surface", "launcher"]

[programs.toybox]
receives = ["compositor", "soundd", "surface"]

[symlinks]
"bin/echo" = "/bin/toybox"
"bin/tone" = "/bin/toybox"

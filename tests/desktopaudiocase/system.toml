# A desktop with a shell and soundd: the T14's shape when #172 wedged it.
#
# `tests/desktopcase` has no daemon behind the shell and `tests/testcases` has
# no desktop in front of it, so the machine where a *shell-spawned* audio client
# meets a null sink existed in neither. That machine is this one: the client's
# stdio are pipes to a terminal, the terminal is a compositor surface, and
# soundd has no device.

assets = ["assets"]

[boot]
start = ["compositor", "soundd", "terminal"]

# `compositor` in its own `receives` is **interim**: a terminal or a picker the
# compositor starts inherits the compositor's namespace, and until the launcher
# can build a child's authority from that child's own manifest row there is no
# other way for a compositor-started window client to hold a compositor
# connector. It comes out with the launcher.
[programs.compositor]
serves = ["compositor"]
receives = ["compositor", "soundd", "launcher"]
devices = ["framebuffer", "keyboard", "mouse"]

[programs.soundd]
serves = ["soundd"]
devices = ["hda-audio", "virtio-sound"]
syscap = ["rt"]

# `soundd` on the terminal is **interim** and travels the same road: `tone` is a
# toybox applet a shell starts, the shell holds what its terminal gave it, and
# only the launcher can give a child the row the manifest wrote for it.
[programs.terminal]
provides = ["surface"]
receives = ["compositor", "soundd", "launcher"]

[programs.shell]
receives = ["surface", "launcher"]

[programs.toybox]
receives = ["compositor", "soundd", "surface"]

[symlinks]
"bin/echo" = "/bin/toybox"
"bin/tone" = "/bin/toybox"

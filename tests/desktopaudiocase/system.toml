# A desktop with a shell and soundd: the T14's shape when #172 wedged it.
#
# `tests/desktopcase` has no daemon behind the shell and `tests/testcases` has
# no desktop in front of it, so the machine where a *shell-spawned* audio client
# meets a null sink existed in neither. That machine is this one: the client's
# stdio are pipes to a terminal, the terminal is a compositor surface, and
# soundd has no device.
init = ["/bin/compositor", "/bin/soundd", "/bin/terminal"]

assets = ["assets"]

# In the directory and not in git, on purpose: 5.99 MB of SoundFont that doom
# synthesises its music from. A sweep cannot tell it from a .DS_Store, so it is
# named here, and a build that cannot find it stops rather than shipping a doom
# with no music.
untracked-assets = ["timgm6mb.sf2"]

[programs]
compositor = {}
soundd = {}
terminal = {}
shell = {}
toybox = {}

[symlinks]
"bin/echo" = "/bin/toybox"
"bin/tone" = "/bin/toybox"

init = ["/bin/soundd", "/bin/test-runner"]

[boot]
start = ["soundd", "test-runner"]

[programs.soundd]
serves = ["soundd"]
devices = ["hda-audio", "virtio-sound"]
realtime = true

[programs.test-runner]
receives = ["soundd"]

[programs.toybox]
receives = ["soundd"]

[symlinks]
"bin/cat" = "/bin/toybox"
"bin/cp" = "/bin/toybox"
"bin/echo" = "/bin/toybox"
"bin/free" = "/bin/toybox"
"bin/grep" = "/bin/toybox"
"bin/hexdump" = "/bin/toybox"
"bin/ls" = "/bin/toybox"
"bin/mkdir" = "/bin/toybox"
"bin/mv" = "/bin/toybox"
"bin/ps" = "/bin/toybox"
"bin/pwd" = "/bin/toybox"
"bin/rm" = "/bin/toybox"
"bin/shutdown" = "/bin/toybox"
# The shipped audio client, and the one the T14 hangs on. The raw-API tone in
# `toyos-rust-tests` drains the same sink perfectly, so a suite that ran only
# that one certified a path no user takes.
"bin/tone" = "/bin/toybox"

# doom, soundd and the assets doom's music is made of.
#
# `tests/doomcase` is deliberately asset-free — its actuator synthesises its own
# sound and opens neither the WAD nor the SoundFont — and this one is the
# opposite: what it exists to check is that `assets/soundfont.sf2` and
# `assets/DOOM1.WAD` reach an initrd and that doom finds both. So the two cannot
# share a config, and this one pays 19 MiB of initrd that no other test should.
#
# No compositor: `/bin/doom --music-check` never opens a window.

assets = ["assets"]

[boot]
start = ["logd", "soundd", "test-runner"]

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does. The kernel stopped writing files at L6 of
# `specs/log-architecture-spec.md`, so a boot config without `logd` is a boot
# whose `/log` is empty — `every_boot_config_runs_logd` is what refuses one.
# It claims no device and serves no port yet (§5.1, §5.2): its whole authority
# is `logread`, which is `Rights::LOG | Rights::WAIT` on a `SysCap` duplicate.
[programs.logd]
syscap = ["logread"]

[programs.soundd]
serves = ["soundd"]
devices = ["hda-audio", "virtio-sound"]
syscap = ["rt"]

# No compositor: `/bin/doom --music-check` opens no window. test-runner passes
# its namespace to doom (§6.7a).
# `logread` is the log gate's own: a spawned test binary does not inherit a
# `SysCap` dup, so the gate that reads the kernel's records runs inside
# `test-runner` itself (`specs/log-architecture-spec.md` §3.2, §9.5).
[programs.test-runner]
receives = ["soundd"]
syscap = ["logread"]

[programs.doom]
receives = ["soundd"]

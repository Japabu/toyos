# Recorded audio-glitch baselines — scheduler-core migration gate A
# (specs/scheduler-core-spec.md §11, recorded at Stage 0).
#
# Each entry holds the underrun histogram measured on the Stage 0 tree for
# one (test, smp) config: `gaps` maps gap length in device periods (2.902ms,
# rounded) to the count of such mid-signal zero runs in one 3s-tone run.
# An absent `gaps` table means the config measured clean — the strict
# zero-gap baseline.
#
# Migration stages 1-6 gate on no regression vs these histograms (total
# count and longest gap class, tests/common/audio.rs check_gap_regression);
# Stage 7 replaces this mechanism with the strict zero-gap target. Re-record
# deliberately, never to paper over a regression: run `cargo test -- audio`
# and copy the histograms printed next to each test.
#
# Example of a non-clean entry:
#   [audio_tone_load.smp1]
#   gaps = { "1" = 3, "4" = 1 }   # three 1-period gaps, one 4-period gap

[audio_tone.smp1]
[audio_tone.smp8]
[audio_tone_load.smp1]
[audio_tone_load.smp8]

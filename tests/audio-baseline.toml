# Audio gate (gate A) baselines — one section per (test, smp) config.
# specs/scheduler-core-spec.md §11, specs/audio-subsystem-spec.md §5.4/§5.9,
# specs/audio-glitch-distribution-2026-07-28.md.
#
# Every config must appear here. A missing section is a hard error, not a
# pass: an ungated config would go green by omission.
#
# Two independent instruments per config; both must hold.
#
#   gaps              Underrun histogram from the captured wav, keyed by gap
#                     length in whole device periods (2.902ms). An absent
#                     table is the strict zero-gap bar, which is what all four
#                     configs carry — the quality target is no dropouts, and
#                     recording a non-empty histogram here would be a decision
#                     to accept audible ones.
#   max_wake_lat_us   Worst single stats window of soundd waking later than a
#                     predicted DMA completion it armed a timer on. Waits that
#                     named no wake time — the idle path, and the one wake
#                     after a drain before the DLL re-locks — contribute
#                     nothing: nothing was due, so nothing can be late.
#   drains            Cycles that found the entire DMA pipeline free (§5.9).
#   underruns         Periods submitted with no client audio behind them.
#
# Why the counters are here at all: the wav is a rare-event detector. One 3s
# tone samples ~1100 device periods once per run, so it only fires when a
# dropout happens to land inside the tone — a 0-10% per-run event that cannot
# resolve a change in the failure rate. soundd's counters are non-zero on
# essentially every run and are direct evidence of the same stall, so they are
# the half of this gate with statistical power. They are scoped to the
# streaming phase: soundd zeroes them when the first client arrives and
# flushes them when the last one leaves, so no number here is diluted by the
# idle path (where soundd waits on raw completion IRQs with no timer and a
# batched IRQ is indistinguishable from a missed deadline).
#
# THE PHYSICAL SCALE. The DMA pipeline holds TX_INFLIGHT_MAX = 8 buffers of
# 128 frames at 44.1kHz = 23.219ms. That is soundd's entire timing budget:
# wake later than one pipeline depth and every buffer has already drained and
# the device has run out of audio. `max_wake_lat_us` limits are therefore
# quantised to whole pipeline depths (1 pl = 23219us), so the number says
# something about the hardware rather than about a particular afternoon.
#
# HOW THE NUMBERS WERE PICKED. Measured over 30 serial runs per config on a
# quiet host (one QEMU at a time, verified before every iteration; Apple M4
# Pro, QEMU 11.0.2 under cross-arch TCG, 1-min load 4.2-6.1 recorded per run).
# Rule, applied uniformly:
#
#     limit = 2x the observed maximum, rounded up to a round number
#
# These are max-of-window order statistics with heavy right tails. At n=30 the
# observed maximum sits near the 97th percentile, so a limit AT the maximum
# would false-red on the order of once every 30 runs per config — four configs
# per invocation would make the gate red more often than the defect it is
# watching. Doubling it puts the per-config false-red rate well under 1% while
# still failing on a doubling of the tail, which is the magnitude a scheduler
# regression that broke RT preemption or the audio IRQ path would produce.
#
# How heavy those tails are is not a guess: on `audio_tone_load.smp1` the
# observed maximum wake lateness went from 26627us at n=15 to 92989us at n=30.
# One more run more than tripled it. That is why the rule has a factor in it
# at all, and why the wake-latency bar on that config is weak — for it the
# sharp instrument is `drains`, not the latency maximum.
#
# WHAT THESE NUMBERS ADMIT. Every config's worst wake lateness exceeds one
# pipeline depth. The spec-derived bar — never wake later than the pipeline
# you are feeding — is NOT met on this tree, and these limits sit above it.
# That is the known residual (mode-B client misses under single-CPU load), a
# separate scoped-out defect; the limits are set to catch it getting worse,
# not to pretend it is absent. The measured value is printed on every run,
# passing or failing, so the residual stays visible in the log rather than
# hiding behind a green tick. When the residual is fixed, every
# `max_wake_lat_us` here should drop to 23219 (one pipeline) and stay there.
#
# `underruns` is dominated by a stream-start transient: the client is added
# with an empty ring and the mix loop submits the already-free buffers before
# cpal's callback thread has filled a slot. Those periods are inaudible (the
# §5.5 connect ramp still has the gain near zero) but they are real silence on
# the wire and are counted as such. The floor is ~4; anything well above it is
# genuine mid-stream starvation.
#
# Re-record deliberately, never casually, and never to make a red run green.
# Every number above must survive being asked "why that value?".
#
# ===========================================================================
# TWO TIERS, AND WHAT EACH ONE CERTIFIES
# ===========================================================================
#
# FAST TIER — `cargo test`, one boot per config, every time.
#   Certifies: this build's counters sit inside the per-run ceilings above,
#   the instrument is alive (tone present, dither present, no clicks), and the
#   capture does not *reproducibly* drop audio. A run that drops audio is
#   re-booted once and only a second dropout fails: the strict zero-gap bar is
#   unchanged, but one Bernoulli trial against a 0-7% per-config rate is not a
#   verdict, and the un-confirmed version measured 12.8% red per invocation on
#   an unmodified tree. The 2-of-2 rule takes that to 0.67%. The first dropout
#   is still printed and its wav still kept.
#   What it CANNOT certify: any statement about a rate. One run is one sample.
#
# THOROUGH TIER — `cargo test --test toyos-build -- --audio-gate 30`, ~17 minutes.
#   What a scheduler-migration stage transition gates on (spec §11 gate A).
#   N iterations of all four configs; every per-run outcome becomes a rate or a
#   distribution, and the fresh sample is compared against the RECORDED SAMPLE
#   below — Mann-Whitney for the counters, Fisher exact for the yes/no
#   outcomes. Not against a fitted constant: a threshold derived from 30 runs
#   carries the sampling error of those 30 runs, and a one-sample test against
#   it claims a confidence it does not have (a sign test against the recorded
#   median of `max_wake_lat_us` has a nominal false-red rate of 0.07% and a
#   real one near 1.5%, purely because the reference median moves by one order
#   statistic).
#
#   At N=30, measured against these distributions, it detects:
#     wake lateness  +25%  99.9%    +20%  93%    +10%   4%  (missed)
#     underruns      +50% 100%      +25%  94%
#     wakes           -5%  99.9%  (completions batched = soundd ran late)
#     dropout rate    10x 100%       5x   71%      3x   5%  (missed)
#   False-red on a clean tree: 0.25%, over 2000 invocations simulated from
#   these samples.
#
#   Read the dropout row honestly: the audible symptom is the WEAKEST
#   instrument here and cannot be made strong. Separating a 3% dropout rate
#   from a 7% one at this confidence needs ~600 runs per config — five hours
#   per config. It stays in the gate because it is the only statistic that
#   says "someone would have heard it"; the counters are what actually decide
#   whether a stage regressed.
#
#   WHY FIXED N AND NOT A SEQUENTIAL TEST. An SPRT on the dropout rate would
#   accept a clean tree after ~17 iterations instead of 30, saving about a
#   third of the wall clock. Two reasons not to: the run is also the artefact
#   you re-baseline from, and a variable-length sample is not comparable to the
#   one recorded here; and the accept rule would have to be combined across all
#   18 statistics, which is where the honesty of the alpha would go to die.
#   What is taken from the sequential idea is the cheap half — fail-side
#   curtailment. A count can only rise, so once one passes the threshold it
#   would face at the full N, the verdict is already decided and the run stops.
#   A badly broken tree fails in minutes; a clean one pays the full 17.
#
#   ALPHA IS 0.001 PER TEST, and it is a constant in `tests/common/stats.rs`,
#   not a field here. A gate whose alpha can be raised is a gate that will be
#   raised on the afternoon it goes red.
#
# BOTH TIERS — the physical bound (`audio::check_physical`). Every number above
#   answers "did this get worse?". Nothing here answered "is this possible?",
#   and the two are different questions. Stage 6's thorough tier PASSED while
#   carrying `wake_lat 153766519us` — 153 seconds inside a test the harness
#   kills at 30 — because a rank test is robust to exactly one absurd value,
#   and it would then have been pasted back into `max_wake_lat_us` below as
#   data. The bound is the wall-clock life of the QEMU process, measured by the
#   harness: soundd's whole life is inside it, so no duration it reports can
#   exceed it, and no count of device periods can exceed the periods that fit
#   in it. Nothing is recorded here to be tuned. A violation is reported as a
#   broken instrument — fatal in both tiers, and in the thorough tier it aborts
#   before the value joins the sample. It is NOT a ceiling: it sits two orders
#   of magnitude above the ones above, because a ceiling admits values that are
#   bad but real, and a stall of even three seconds should still be reported as
#   the regression it is.
#
# ===========================================================================
# THE RECORDED SAMPLE
# ===========================================================================
#
# 30 serial invocations of the audio suite, quiet host (one QEMU at a time,
# verified before every iteration; Apple M4 Pro, QEMU 11.0.2 under cross-arch
# TCG, 1-min load 3.9-8.0 recorded per run), tree 6d6a230 + the two harness
# fixes that this gate depends on.
#
# Three of the 120 config-runs originally failed to parse — two lost a field of
# soundd's stats line to console interleaving, one lost the `===TEST_END===`
# marker the same way and timed out. All three causes are fixed (the stats
# parser splices across the interruption; `run_test` matches the marker
# anywhere in the line), and the arrays below are the same captures re-read
# with the fixed parsers, so every config carries n=30. The three affected runs
# never got a gap histogram printed, which is why `gap_sample` is 28/29 on two
# configs while the counter arrays are 30 long.
#
# `ceiling_runs` is 0 everywhere: no run in 120 breached the per-run limits
# above. That is the intended relationship between the tiers — the ceilings are
# a catastrophe detector, the distributions are the sensitive instrument.


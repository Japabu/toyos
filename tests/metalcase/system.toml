# The metal-sim boot: what `Profile::Metal` puts in front of userland.
#
# soundd, netd and sshd are here for exactly the reason they have no device:
# their graceful exit is half of what this config certifies, and with a console
# `metal_sim_compositor` reads their exit lines rather than assuming them.
# sshd is the one whose absence *is* the device absence — it has no device of
# its own and reaches the machine's shape only through netd — and it was the
# one this config left out, so nothing anywhere ran the branch where it finds
# no network. It costs the boot the second `NetdConn::connect_blocking` spends
# retrying a netd that will never come
# (`specs/issues/hardware/network-clients-pay-a-boot-retry.md`), which is the price of
# certifying the line at all.
# test-runner makes the boot announce itself, so the harness waits for a
# marker instead of guessing from pixels — and it is what lets an in-guest
# binary run on the machine shape that gets flashed. Under `mute` it simply
# parks on a console that never produces a byte.

assets = ["assets"]

[boot]
start = ["compositor", "soundd", "netd", "sshd", "test-runner"]

# `compositor` in its own `receives` is **interim**: a terminal or a picker the
# compositor starts inherits the compositor's namespace, and until the launcher
# can build a child's authority from that child's own manifest row there is no
# other way for a compositor-started window client to hold a compositor
# connector. It comes out with the launcher.
[programs.compositor]
serves = ["compositor"]
receives = ["compositor", "soundd", "launcher"]
devices = ["framebuffer", "keyboard", "mouse"]

[programs.soundd]
serves = ["soundd"]
devices = ["hda-audio", "virtio-sound"]
syscap = ["rt"]

[programs.netd]
serves = ["netd"]
devices = ["nic"]

[programs.sshd]
receives = ["netd", "launcher"]

# The union its guest binaries need on this machine shape.
[programs.test-runner]
receives = ["compositor", "soundd", "netd"]

# doom beside soundd, and nothing else that makes noise.
#
# `doom_sound_flood` drives `/bin/doom --sound-stress`, whose producer is the
# game's own sound module — the only thing that can reach it is the binary that
# owns it, so the binary has to be in the image. It is in this config rather
# than in `tests/testcases` because doom is 4 MiB and every other test boots
# that one.
#
# No `assets`: the actuator synthesises its own sound and never opens the WAD
# or the soundfont, so neither belongs in this initrd either.

[boot]
start = ["logd", "soundd", "test-runner"]

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does. The kernel keeps the record ring and writes no file at all, so a
# boot config without `logd` is a boot whose `/log` is empty —
# `every_boot_config_runs_logd` is what refuses one.
# It claims no device and serves no port: its whole authority
# is `logread`, which is `Rights::LOG | Rights::WAIT` on a `SysCap` duplicate.
[programs.logd]
syscap = ["logread"]

[programs.soundd]
serves = ["soundd"]
devices = ["hda-audio", "virtio-sound"]
syscap = ["rt"]

# test-runner passes its whole namespace to the binaries it spawns, so
# it holds what doom needs. No compositor here — doom's `--sound-stress` opens
# no window.
# `logread` is the log gate's own: a spawned test binary does not inherit a
# `SysCap` dup, so the gate that reads the kernel's records runs inside
# `test-runner` itself.
[programs.test-runner]
receives = ["soundd"]
syscap = ["logread"]

[programs.doom]
receives = ["soundd"]

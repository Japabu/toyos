[package]
name = "tls-multi-crate"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
tls-dep = { path = "dep" }

[lints.rust]
warnings = "deny"

# The guest profile — `specs/boot-image-split.md` §6. A test binary runs on the
# same machine as the programs it tests, so it is built the same way.
[profile.toyos]
inherits = "dev"
opt-level = 2
debug = true
debug-assertions = true
overflow-checks = true

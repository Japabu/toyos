[package]
name = "tls-cranelift"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
cranelift-codegen = { version = "0.128.3", default-features = false, features = ["std", "timing", "unwind", "all-native-arch"] }
cranelift-frontend = "0.128.3"
target-lexicon = "0.13"

[patch.crates-io]
target-lexicon = { git = "https://github.com/Japabu/target-lexicon", branch = "toyos" }

[lints.rust]
warnings = "deny"

# The guest profile — `specs/boot-image-split.md` §6. A test binary runs on the
# same machine as the programs it tests, so it is built the same way.
[profile.toyos]
inherits = "dev"
opt-level = 2
debug = true
debug-assertions = true
overflow-checks = true

# The diagnostic boot: a machine that reaches `Boot: complete` and then leaves
# the kernel's boot log on the panel, for a machine that has no serial port.
#
# `panic_console::boot_checkpoint` paints the tail of the log ring at every boot
# phase boundary and returns immediately once anything claims
# DEVICE_FRAMEBUFFER. On the image that was flashed to the T14 the compositor
# claimed it tens of milliseconds after the last checkpoint, so every line the
# kernel logged — including the one `i8042:` line that says why the integrated
# keyboard is dead — was on screen for about a tenth of a second and then gone.
#
# `/bin/init` is in every image and holds the one `SysCap`, so the guarantee is
# no longer "nothing here *can* claim the framebuffer" but "this config declares
# no `devices`" — which `no_diag_program_claims_the_screen` checks before the
# image is written, and which nothing checked before. The reachable set is the
# same; a bug in init could reach a device where previously no code in the image
# could, and that is the trade.
#
# **Two programs now, and the guarantee is restated rather than assumed.** It
# used to be "nothing here can claim the framebuffer, because the compositor is
# not built into this image at all". `logd` is in this image because the kernel
# writes no file, and an unchanged config here would flash a T14 that logs to a
# panel and nowhere else. The argument survives verbatim: `logd` declares no `devices` at
# all — its whole row is `syscap = ["logread"]` — so the reachable set is
# unchanged and `no_diag_program_claims_the_screen` still checks it before the
# image is written.
#
# The other program it starts prints the cwd and exits.
[boot]
start = ["logd", "toybox"]

# **Every image that carries a `TOYOS-LOG` partition runs this**, and every
# image does. The kernel writes no file at all, so a boot config without
# `logd` is a boot whose `/log` is empty — `every_boot_config_runs_logd`
# is what refuses one.
# It claims no device and serves no port: its whole authority
# is `logread`, which is `Rights::LOG | Rights::WAIT` on a `SysCap` duplicate.
[programs.logd]
syscap = ["logread"]

[programs.toybox]
args = ["pwd"]

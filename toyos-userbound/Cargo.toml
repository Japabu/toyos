# A member of the host workspace (root `Cargo.toml`), like toyos-gpt, toyos-pci
# and toyos-elf: the kernel depends on it by path and its tests run on the host,
# with no target-triple juggling. What lives here is the line between Ring 3 and
# Ring 0 as it appears in an address — the one thing every user pointer the
# kernel dereferences is checked against, and the one thing a trap is classified
# by. Its whole boundary table costs milliseconds here and a boot in a guest.
#
# It is a crate rather than two files in `kernel/src` compiled out through a
# `#[path]` attribute, which is what `kernel-span/` and `kernel-fault/` were:
# a subject that names nothing outside itself is a library, and a library has
# its tests beside its code.

[package]
name = "toyos-userbound"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# A member of the host workspace (root `Cargo.toml`), like toyos-gpt and
# toyos-ps2: the kernel depends on it by path and its tests run on the host,
# with no target-triple juggling. An ELF is bytes somebody else wrote, and every
# one the kernel opens crossed a trust boundary — so the parser has to be
# exercised against hostile bytes far more often than a QEMU boot allows.

[package]
name = "toyos-elf"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

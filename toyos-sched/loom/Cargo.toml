[package]
name = "toyos-sched-loom"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# This package exists only to run the loom model checker over the scheduler
# primitives (spec §10.6). It compiles `../src/*.rs` into its own crate with
# `feature = "loom"` on, so every atomic in those files becomes a
# loom-instrumented one. Nothing depends on this package, and `kernel/` is
# excluded from the host workspace this package is a member of, so loom never
# reaches `kernel/Cargo.lock`.

[features]
default = ["loom"]
loom = []
# Deep cross-container invariant asserts. Mirrors `toyos-sched`'s feature so
# the shared sources compile identically here; the loom models exercise the
# primitives, not whole passes, so nothing enables it.
check = []
# Likewise the negative gate's escape hatch: declared so `cfg` checking knows
# the name, never enabled — the loom models exercise the primitives, and the
# old protocol is the simulator's business.
protocol-port = []
# And likewise the kernel's stray-write tripwire, which compiles a layout
# reader onto `CpuSched`. Declared so `cfg` checking knows the name; nothing
# here enables it, because the models exercise the primitives and the
# tripwire's subject is a whole record in a kernel `static`.
tripwire = []
# Model the mandatory preempt-disabled push away (spec §7.2). The
# `preempted_producer_strands_suffix` case must FAIL under this feature —
# `loom/tests/loom_mailbox.rs` asserts exactly that.
no-preempt-guard = []
# The negative control for the sleep handshake's kick edge (spec §7.3, §7.5).
# It makes `mailbox.rs`'s `Doorbell::ring` read the doorbell's bits `Relaxed`
# instead of `AcqRel`, so a producer can miss a consumer's freshly published
# `SLEEPING` bit and elide the IPI that would have woken it, and
# `loom_sleep.rs` must red under it — the one command that proves the model
# has teeth:
#
#   cargo test -p toyos-sched-loom --features doorbell-kick-relaxed \
#     --test loom_sleep
#
# Never on by default and never reachable from a kernel build, which declares
# the same name only so `cfg` checking knows it.
doorbell-kick-relaxed = []
# The negative control for `Balance::PushOnSurplus`'s ordering. It weakens
# `cpu.rs`'s `balance_fence` from a `SeqCst` fence to a release one, which
# orders stores against stores and nothing against a later load — so the push's
# surplus store and the sleeper's SLEEPING store may each be missed by the
# other's read, and the CPU halts with a surplus published and no probe
# outstanding. `loom_push.rs` must red under it:
#
#   cargo test -p toyos-sched-loom --features push-fence-relaxed --test loom_push
#
push-fence-relaxed = []

[dependencies]
loom = "0.7"

[lib]
# The primitives are compiled into the lib; the models are the test targets.
path = "src/lib.rs"
# The shared sources' own `#[cfg(test)]` unit tests belong to `toyos-sched`
# and run there, against real atomics. Loom atomics outside a `loom::model`
# panic, so this crate exposes no unit tests of its own.
test = false

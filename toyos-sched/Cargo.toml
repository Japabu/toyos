# This crate, `sim/` and `loom/` are three members of the host workspace (root
# `Cargo.toml`), which is where all three are listed. They used to be a
# workspace of their own here; the set of host-tested crates is one list now,
# and it is that one.

[package]
name = "toyos-sched"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
# Host-side additions for the simulator and tests. Never enabled by the kernel.
std = []
# Deep cross-container invariant asserts (spec invariants.rs). Off by default;
# enabled by sim runs and kernel check builds.
check = []
# Compiles the escape hatch `old_steal_port` needs to re-create the OLD
# scheduler's steal-in-transit algorithm (spec §10.3). The simulator enables
# it; the kernel does not, so the old protocol is not reachable from
# production code at all.
protocol-port = []
# Declared, never enabled here: the `toyos-sched-loom` package compiles these
# same sources into its own crate with the feature on, so `src/sync.rs`
# resolves to loom's instrumented atomics. Keeping it a feature of a separate
# package (rather than a `cfg(loom)` dependency) keeps loom and its 30
# transitive host crates out of `kernel/Cargo.lock` — still true, and the
# reason it is: `kernel/` is excluded from the host workspace and resolves
# against its own lockfile, and nothing the kernel builds depends on
# `toyos-sched-loom`.
loom = []

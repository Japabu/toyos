# Its own workspace, like toyos-ps2 and toyos-sched: the kernel depends on it
# by path and `cargo test` runs here on the host, with no target-triple
# juggling. No dependencies at all — a filesystem driver that pulls in a crate
# graph cannot be audited for the one property that matters here, which is
# that no path reachable from on-disk bytes can panic.
[workspace]

[package]
name = "toyos-fat32"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dev-dependencies]
# The volume checker this crate's tests are judged by. A dev-dependency and
# never a dependency: it is the outside judge of what this crate writes, and it
# must not be reachable from the driver it judges.
toyos-fat32-check = { path = "../toyos-fat32-check" }

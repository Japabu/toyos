[package]
name = "kernel-fault"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# This package exists only to run `kernel/src/arch/idt/fault_class.rs` — whose
# fault a trap was, which decides whether a process dies or the machine halts —
# on the host, where the whole table costs milliseconds and no guest at all. The
# file is compiled into this crate rather than transliterated: a transliteration
# is a second copy of the classification, and this exists because the first copy
# is the one that must be right.
#
# The one thing that file names outside itself is the user/kernel bound in
# `kernel/src/mm/user_span.rs`, so that file is compiled in beside it at the
# path the kernel gives it. It is the same constant and not a copy, which is the
# property that makes a boundary assertion here mean anything.
#
# `kernel-span`'s and `kernel-elide`'s arrangement, for their reason: it sits
# beside `kernel/` rather than inside it because `kernel/.cargo/config.toml`
# cross-compiles everything below it to `x86_64-unknown-none`, and cargo refuses
# to merge an inherited `build.target` away. A member of the root host
# workspace, where the root `Cargo.lock` pins it and
# `cargo test --workspace --exclude toyos-build` is what runs it.

[dependencies]

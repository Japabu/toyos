[package]
name = "kernel-span"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# This package exists only to run `kernel/src/mm/user_span.rs` — the user/kernel
# bound, alignment and 2 MiB-straddle arithmetic every user-memory access rests
# on — on the host, where its whole boundary table costs milliseconds. The file
# is compiled into this crate rather than transliterated: a transliteration is a
# second copy of the arithmetic, and this exists because the first copy is the
# one that must be right.
#
# It sits beside `kernel/` rather than inside it for `kernel-loom`'s reason:
# `kernel/.cargo/config.toml` cross-compiles everything below it to
# `x86_64-unknown-none`, and cargo refuses to merge an inherited `build.target`
# away. Beside it, and in the host workspace (root `Cargo.toml`), where a host
# harness belongs.

[dependencies]

name: nullsink-probe

# Why soundd's `presenting a null sink` never reaches the boot console on a
# runner and always does here. `metal_sim_null_audio` is 5/5 red on CI
# (run 31258202923) and 0/N here, so the dev host is not the instrument.
#
# The probe asks the two questions the failure message cannot: does the line
# arrive at all if nobody touches the guest, and if not, where is soundd? The
# second is Ctrl+Alt+D, whose process-table half is the only place a task no
# CPU was ever given appears.
#
# It never fails. Throwaway branch, throwaway workflow.

on:
  push:
    branches: ['ci/probe-nullsink']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    container:
      image: debian:sid
      options: --device=/dev/kvm
    steps:
      - name: deps
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git curl ca-certificates jq zstd xz-utils build-essential \
            qemu-system-x86 > /dev/null
          qemu-system-x86_64 --version | head -1
          grep -m1 'model name' /proc/cpuinfo

      - uses: actions/checkout@v4

      - name: rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: install the toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          tag=toolchain-linux-x86_64-$(git rev-parse HEAD:rust HEAD:toyos-abi/src \
                HEAD:toyos/src HEAD:userland/libc/src | sha256sum | cut -c1-16)
          echo "toolchain: $tag"
          api=https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$tag
          for _ in $(seq 90); do
            asset=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$api" \
              | jq -r '.assets[]? | select(.name=="toyos-toolchain.tar.zst") | .url')
            [ -n "$asset" ] && break
            echo "waiting for the toolchain workflow to publish $tag ..."
            sleep 60
          done
          test -n "$asset"
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" "$asset" -o /tmp/t.tar.zst
          mkdir -p rust/build
          zstd -dc /tmp/t.tar.zst | tar -C rust/build -x
          rustup toolchain link toyos "$PWD/rust/build/x86_64-unknown-linux-gnu/stage2"

      - name: metal_sim_null_audio
        run: |
          set -o pipefail
          cargo test --test toyos-build -- metal_sim_null_audio \
            --jobs 1 --host-slots 0 --nocapture \
            2>&1 | tee /tmp/null.log || echo "SUITE-EXIT: $?"

      - name: hda_two_live_refused
        if: always()
        run: |
          set -o pipefail
          cargo test --test toyos-build -- hda_two_live_refused \
            --jobs 1 --host-slots 0 --nocapture \
            2>&1 | tee /tmp/hda.log || echo "SUITE-EXIT: $?"

      - name: the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nullsink-r${{ matrix.rep }}
          path: |
            /tmp/null.log
            /tmp/hda.log
          if-no-files-found: warn
          retention-days: 5

name: kvm-probe

on:
  push:
    branches: ['ci/probe-kvm']
  workflow_dispatch:

jobs:
  kvm:
    runs-on: ubuntu-24.04
    steps:
      - name: unlock /dev/kvm
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          if exec 3<>/dev/kvm; then echo "OPEN-RW: yes"; exec 3<&-; else echo "OPEN-RW: no"; fi

      - name: qemu
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 ovmf
          qemu-system-x86_64 --version | head -1

      - name: kvm starts
        run: |
          set +e
          echo quit | qemu-system-x86_64 -accel kvm -machine q35 -m 256 \
            -display none -nodefaults -monitor stdio
          echo "KVM-START-EXIT: $?"
          echo quit | qemu-system-x86_64 -accel kvm -cpu host -smp 4 -machine q35 -m 2048 \
            -display none -nodefaults -monitor stdio
          echo "KVM-HOST-CPU-EXIT: $?"

      - name: guest cpu features under kvm
        run: |
          set +e
          qemu-system-x86_64 -accel kvm -cpu host -machine q35 -m 256 -display none \
            -nodefaults -cpu help 2>&1 | head -5
          echo "== what the host offers a guest"
          grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -x -E 'x2apic|tsc_deadline_timer|invtsc|xsave|avx2|pcid|smep|smap|rdtscp|constant_tsc|nonstop_tsc' | sort

      - name: guest throughput, kvm vs tcg
        run: |
          set -e
          cat > /tmp/kvmbench.S <<'EOF'
          .code16
          .section .text
          .globl _start
          _start:
            mov $0x0000, %ax
            mov %ax, %ds
            xor %ecx, %ecx
          1:
            add $1, %ecx
            cmp $0x08000000, %ecx
            jb 1b
            mov $0x2000, %dx
            mov $0x00, %al
            outb %al, %dx
            hlt
            jmp .
          .org 510
          .byte 0x55, 0xaa
          EOF
          sudo apt-get install -y -qq binutils
          as --32 /tmp/kvmbench.S -o /tmp/kvmbench.o
          ld -m elf_i386 -Ttext 0x7c00 --oformat binary -o /tmp/kvmbench.bin /tmp/kvmbench.o
          ls -l /tmp/kvmbench.bin
          for accel in kvm tcg; do
            t0=$(date +%s%N)
            qemu-system-x86_64 -accel $accel -m 256 -display none -nodefaults \
              -drive file=/tmp/kvmbench.bin,format=raw,if=floppy \
              -device isa-debug-exit,iobase=0x2000,iosize=1 || true
            t1=$(date +%s%N)
            echo "SPIN-$accel-MS: $(( (t1-t0)/1000000 ))"
          done

name: runner-probe

# Whether a bigger machine can be bought for this repository at all.
#
# GitHub's larger hosted runners are created by name, and the name is whatever
# whoever created it chose; there is no label that simply works. These are the
# default names the creation UI offers, so a job that is *picked up* proves one
# exists and a job that sits queued proves none of these do. Cancel the run once
# it has been queued long enough to be an answer — a job with no runner waits
# rather than failing, so silence is the result here and not a hang.

on:
  push:
    branches: ['ci/probe-runner']
  workflow_dispatch:

jobs:
  larger:
    strategy:
      fail-fast: false
      matrix:
        label:
          - ubuntu-latest-4-cores
          - ubuntu-latest-8-cores
          - ubuntu-latest-16-cores
    runs-on: ${{ matrix.label }}
    timeout-minutes: 5
    steps:
      - name: what this machine is
        run: |
          echo "label: ${{ matrix.label }}"
          nproc
          grep -m1 'model name' /proc/cpuinfo
          free -g | head -2
          ls -l /dev/kvm || echo "no /dev/kvm"

  # The control: the same three questions on the runner every other job uses, so
  # the comparison above is against a number taken the same way.
  standard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: what this machine is
        run: |
          echo "label: ubuntu-24.04"
          nproc
          grep -m1 'model name' /proc/cpuinfo
          free -g | head -2
          ls -l /dev/kvm || echo "no /dev/kvm"

name: gate A, thorough

# `tests/audio-baseline.toml`'s thorough tier, one audio test per job.
#
# The tier is N boots per config taken strictly one at a time, so it is the one
# thing in this tree that a second machine shortens rather than perturbs — and
# each job's guest has a runner to itself, which is the quiet host the recorded
# sample was attested on and the dev host can no longer offer.
#
# **The container the twelve shards run in, and the reason is this job's whole
# purpose.** It ran on a bare `ubuntu-24.04` until 2026-08-10 — QEMU 8.2.2,
# against 11.0.3 everywhere else in CI and on the dev host — which made the one
# arm that exists to be *compared* a third instrument. `specs/ci-plan.md` §7.3
# is the measurement: three major versions of QEMU changes test outcomes. §9's
# open question is whether a runner's gate A spread is comparable with the dev
# host's, and a number taken on a QEMU neither of them runs cannot answer it.
#
# What still differs from the dev host after this, deliberately, is the
# accelerator (KVM against cross-arch TCG) and the host CPU — §8's table, and
# the axis the whole CI configuration is arranged to isolate.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: iterations per config
        required: true
        default: '30'
      ref:
        description: branch to run against
        required: false
  # `03:10 UTC` — `ci.yml`'s nightly is `03:00`, `host-tests.yml`'s is `03:05`;
  # this stays clear of both. `specs/testing-strategy.md` §5 names gate A's
  # thorough tier as part of what the nightly runs; nothing scheduled it until
  # now. A `schedule` event carries no `inputs`, so `iterations` below falls
  # back to the same 30 `workflow_dispatch` already defaults to — the N=30
  # thorough configuration the two jobs below run against `main`.
  schedule:
    - cron: '10 3 * * *'

concurrency:
  group: gate-a-${{ github.ref }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # `--device=/dev/kvm` and root inside the container, exactly as the shards:
    # the node ships `crw-rw---- root:kvm` and root opens it, so the
    # `sudo chmod 666 /dev/kvm` a bare runner needed went with the bare runner.
    container:
      image: debian:sid
      options: --device=/dev/kvm
    steps:
      # Before the checkout, because `actions/checkout` wants git and this
      # image has none. Three attempts, for the reason `ci.yml`'s own `deps`
      # carries: `sid` is a rolling release and its mirror is not a fixed
      # artifact.
      #
      # No `ovmf` package: the firmware is `ovmf/` in this repository on every
      # host (`src/qemu.rs`, `tests/common/qemu.rs`), so the apt one the bare
      # runner installed was never opened.
      - name: deps
        run: |
          got=no
          for attempt in 1 2 3; do
            if apt-get update -qq \
               && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                    git curl ca-certificates jq zstd xz-utils build-essential \
                    qemu-system-x86 > /dev/null; then
              got=yes
              break
            fi
            echo "apt attempt $attempt failed"
            [ "$attempt" = 3 ] || sleep 20
          done
          if [ "$got" != yes ]; then
            echo "::error::apt failed three times against sid's mirror. Nothing here is about"
            echo "::error::the tree — re-run the job."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # A gate A verdict is only comparable with the sample it is compared
      # against, so the instrument is named before anything boots.
      - name: the instrument
        run: .github/instrument.sh

      - name: rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # **This workflow builds no toolchain and never waits for one.** A
      # dispatch runs after the branch has already been through
      # `toolchain.yml` on its pull request; a scheduled run targets `main`,
      # whose own push already triggers `toolchain.yml`. Either way a missing
      # release is a mistake about which ref was dispatched or a race with
      # that push, and the script says so rather than sitting in a loop.
      - name: install the toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/install-toolchain.sh

      # The host conditions line every run prints is the point of running it
      # here, so nothing is captured away from it.
      #
      # `inputs.iterations || '30'`: a `schedule` event carries no `inputs` at
      # all, where `workflow_dispatch`'s `required: true, default: '30'` always
      # populates it, so the fallback is reached only on the trigger that has
      # no other way to say 30.
      - name: gate
        run: |
          cargo test --test toyos-build -- \
            --audio-gate ${{ inputs.iterations || '30' }} \
            --shard ${{ matrix.shard }}/2 --host-slots 0 2>&1 | tee /tmp/gate-a.log
          exit "${PIPESTATUS[0]}"

      - name: the sample, whatever the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-a-shard-${{ matrix.shard }}
          path: /tmp/gate-a.log
          retention-days: 30

  # **A nightly red must surface somewhere a human actually looks**, the same
  # reason `ci.yml`'s `nightly-red` and `host-tests.yml`'s `nightly-red-host`
  # exist. Only on `schedule`: a `workflow_dispatch` of this workflow is
  # somebody watching the run directly.
  #
  # Named `nightly-red-gate-a`, not `nightly-red`: a job id becomes a check
  # run name, and `ci.yml` already has a job called `nightly-red` — two jobs
  # sharing that id across workflows would produce two check runs under one
  # context.
  nightly-red-gate-a:
    needs: [gate]
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.gate.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: file or update "nightly is red"
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_RESULT: ${{ needs.gate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export TITLE="nightly is red"
          export BODY="Run: $RUN_URL"$'\n'"Failed jobs: gate-a($GATE_RESULT)"
          .github/nightly-red.sh

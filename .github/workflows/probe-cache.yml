name: probe cache

# **Does a restored `target/` buy a shard anything, and what does carrying it
# cost?** `specs/issues/build/every-shard-rebuilds-the-whole-tree.md` measured
# the thing to beat — about 435 s of `cargo build` inside every one of thirteen
# jobs, 41% of the widest shard's critical path — and asked for its own A/B
# rather than a change folded into somebody else's task. This is that A/B, in
# the shape the issue names: one shard-shaped build with a warm cache against
# one without, in the same run, on the same image, from the same commit.
#
# The arms differ in one thing, which is whether `actions/cache/restore` found
# anything. `cold` writes the entry `warm` reads, so `needs:` is what makes the
# two comparable rather than two runs taken hours apart — the control-arm shape
# `probe-xhci-break.yml` established.
#
# `process_stats` and not a whole shard on purpose: the test is 115 ms, so the
# step is the build, which is the quantity in question. What it does not price
# is the extra profiles a real shard's later tests boot; the shared block, the
# harness, `toyos-ld`, `toyos-cc` and the default profile's kernel, bootloader
# and userland are all in it.
#
# Two things the log is read for besides the clock:
#
# - **`external deps changed: cleaning`.** `src/build.rs`'s external
#   fingerprint carries the *mtime* of `toyos-ld`'s binary, and a job that
#   rebuilds that linker gets a new one — so a restored `target/` for the
#   kernel, the bootloader and userland may be `cargo clean`ed the moment it
#   arrives. If the warm arm prints those lines, the cache bought nothing for
#   the three largest crates and the fingerprint is the thing to fix first.
# - **What the entry weighs.** §7.3 records what an unbounded upload did to
#   shard 9 of run `31247206462`: 44 minutes, and a job that had its answer
#   reported as cancelled. Thirteen jobs restoring a multi-gigabyte entry is a
#   cost against the 435 s, not a free win.

on:
  push:
    branches: ['ci/probe-*']
  workflow_dispatch:

concurrency:
  group: probe-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: debian:sid
      options: --device=/dev/kvm
    steps:
      - name: deps
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git curl ca-certificates jq zstd xz-utils build-essential \
            qemu-system-x86 > /dev/null

      - uses: actions/checkout@v4

      - name: the instrument
        run: .github/instrument.sh

      - name: rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: install the toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          tag=toolchain-linux-x86_64-$(git rev-parse HEAD:rust HEAD:toyos-abi/src \
                HEAD:toyos/src HEAD:userland/libc/src | sha256sum | cut -c1-16)
          echo "toolchain: $tag"
          api=https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$tag
          asset=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$api" \
            | jq -r '.assets[]? | select(.name=="toyos-toolchain.tar.zst") | .url')
          test -n "$asset"
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" "$asset" -o /tmp/t.tar.zst
          mkdir -p rust/build
          zstd -dc /tmp/t.tar.zst | tar -C rust/build -x
          rustup toolchain link toyos "$PWD/rust/build/x86_64-unknown-linux-gnu/stage2"

      - name: build, cold
        run: .github/probe-cache.sh cold

      - name: what a target directory for this tree weighs
        run: |
          {
            echo "### cold"
            echo ""
            echo '```'
            du -sh $(cat /tmp/target-dirs) 2>/dev/null | sort -h
            echo "cargo home: $(du -sh "$HOME/.cargo" | cut -f1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            kernel/target
            bootloader/target
            userland/target
            toyos-ld/target
            toyos-cc/target
            tests/target
            tests/toyos-rust-tests/*/target
          key: probe-cache-${{ github.run_id }}

  warm:
    needs: [cold]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: debian:sid
      options: --device=/dev/kvm
    steps:
      - name: deps
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git curl ca-certificates jq zstd xz-utils build-essential \
            qemu-system-x86 > /dev/null

      - uses: actions/checkout@v4

      - name: the instrument
        run: .github/instrument.sh

      - name: rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: install the toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          tag=toolchain-linux-x86_64-$(git rev-parse HEAD:rust HEAD:toyos-abi/src \
                HEAD:toyos/src HEAD:userland/libc/src | sha256sum | cut -c1-16)
          api=https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$tag
          asset=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$api" \
            | jq -r '.assets[]? | select(.name=="toyos-toolchain.tar.zst") | .url')
          test -n "$asset"
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" "$asset" -o /tmp/t.tar.zst
          mkdir -p rust/build
          zstd -dc /tmp/t.tar.zst | tar -C rust/build -x
          rustup toolchain link toyos "$PWD/rust/build/x86_64-unknown-linux-gnu/stage2"

      # The one difference between the two arms. Timed by the step itself,
      # because a restore that costs more than the build it saves is the answer
      # and not an aside.
      - id: restore
        name: the entry cold wrote
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            kernel/target
            bootloader/target
            userland/target
            toyos-ld/target
            toyos-cc/target
            tests/target
            tests/toyos-rust-tests/*/target
          key: probe-cache-${{ github.run_id }}

      - name: the restore hit
        run: |
          echo "cache-hit: ${{ steps.restore.outputs.cache-hit }}"
          test "${{ steps.restore.outputs.cache-hit }}" = true \
            || { echo "::error::the warm arm restored nothing, so there is no A/B here"; exit 1; }

      - name: build, warm
        run: .github/probe-cache.sh warm

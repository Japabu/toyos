name: ci

# The guest suite, on a machine the dev host does not have: x86_64 with KVM, so
# the guests run natively instead of under cross-arch TCG.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      # **Deliberately not unlocked.** `/dev/kvm` is crw-rw---- root:kvm and the
      # runner user is not in the group, so `kvm_usable` says no and every boot
      # is TCG. A `sudo chmod 666 /dev/kvm` is all it takes to run these guests
      # natively, and today that makes every one of them panic — a real kernel
      # defect the dev host's cross-arch TCG cannot see (known-issues §3). The
      # canary job below is where that is watched; this is where the suite has
      # to be able to go green.
      - name: accelerator
        run: ls -l /dev/kvm

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qemu-system-x86 ovmf zstd
          qemu-system-x86_64 --version | head -1

      # The same key `toolchain.yml` publishes under. Waited for rather than
      # depended on, because that workflow must survive this one being
      # cancelled — and on nearly every branch the release is already there.
      - name: install the toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=toolchain-linux-x86_64-$(git rev-parse HEAD:rust HEAD:toyos-abi/src \
                HEAD:toyos/src HEAD:userland/libc/src | sha256sum | cut -c1-16)
          echo "toolchain: $tag"
          for _ in $(seq 120); do
            gh release view "$tag" >/dev/null 2>&1 && break
            echo "waiting for the toolchain workflow to publish $tag ..."
            sleep 60
          done
          gh release download "$tag" -p 'toyos-toolchain.tar.zst' \
            -O /tmp/toolchain.tar.zst
          mkdir -p rust/build
          zstd -dc /tmp/toolchain.tar.zst | tar -C rust/build -x
          stage2="$PWD/rust/build/x86_64-unknown-linux-gnu/stage2"
          rustup toolchain link toyos "$stage2"
          "$stage2/bin/rustc" -vV

      # `--host-slots 0`: the semaphore arbitrates between worktrees on one
      # host, and a shard is a host with one suite on it.
      - name: suite
        run: |
          cargo test --test toyos-build -- \
            --shard ${{ matrix.shard }}/4 --jobs 4 --host-slots 0

      - name: what a red run left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}-scratch
          path: |
            target/test-durations
            /tmp/toyos-tests-*/
          if-no-files-found: ignore
          retention-days: 7

  # One test, natively, so that the day the #GP in known-issues §3 is fixed
  # announces itself instead of waiting for somebody to try again. Red today and
  # `continue-on-error` because of it: this is a watch, and it may not be able
  # to hold the whole build red.
  kvm-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: unlock kvm
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          grep -m1 'model name' /proc/cpuinfo

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qemu-system-x86 ovmf zstd

      - name: install the toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=toolchain-linux-x86_64-$(git rev-parse HEAD:rust HEAD:toyos-abi/src \
                HEAD:toyos/src HEAD:userland/libc/src | sha256sum | cut -c1-16)
          gh release download "$tag" -p 'toyos-toolchain.tar.zst' -O /tmp/t.tar.zst
          mkdir -p rust/build
          zstd -dc /tmp/t.tar.zst | tar -C rust/build -x
          rustup toolchain link toyos "$PWD/rust/build/x86_64-unknown-linux-gnu/stage2"

      - name: one test, on real hardware virtualisation
        run: cargo test --test toyos-build -- --jobs 1 --host-slots 0 process_stats

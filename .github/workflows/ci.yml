name: ci

# The guest suite, on a machine the dev host does not have: x86_64 with KVM, so
# the guests run natively instead of under cross-arch TCG.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SHARDS: 4

jobs:
  # A toolchain is 1.1 GB of product out of an hour of x.py, and it is a
  # function of the rust fork plus the three trees that end up inside the
  # sysroot. Keyed on exactly those, so a branch that changes none of them —
  # nearly all of them — restores in seconds, and one that changes `toyos-abi`
  # builds its own without waiting for anybody, which is the whole of the
  # shared-sysroot contention `specs/worktrees.md` §3 describes.
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      tag: ${{ steps.key.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: key
        run: |
          sum=$(git rev-parse HEAD:rust HEAD:toyos-abi/src HEAD:toyos/src \
                              HEAD:userland/libc/src | sha256sum | cut -c1-16)
          echo "tag=toolchain-linux-x86_64-$sum" >> "$GITHUB_OUTPUT"

      - id: have
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.key.outputs.tag }}" >/dev/null 2>&1; then
            echo "Already published: ${{ steps.key.outputs.tag }}"
            echo "build=no" >> "$GITHUB_OUTPUT"
          else
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: reclaim runner disk
        if: steps.have.outputs.build == 'yes'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: deps
        if: steps.have.outputs.build == 'yes'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            cmake ninja-build build-essential pkg-config libssl-dev zstd \
            qemu-system-x86 ovmf

      # Full history, deliberately: rust's bootstrap finds the upstream commit
      # to download a prebuilt LLVM for by walking back to the newest bors
      # commit, and a shallow clone has none.
      - name: the rust fork
        if: steps.have.outputs.build == 'yes'
        run: |
          t0=$(date +%s)
          git submodule update --init rust
          echo "SUBMODULE-SECONDS: $(( $(date +%s) - t0 ))"

      # GITHUB_ACTIONS=true puts bootstrap on its own CI path, where it assumes
      # HEAD is a PR merge commit and takes HEAD^1 as the upstream commit whose
      # LLVM to fetch. In this fork HEAD^1 is our own merge of upstream, which
      # rust-lang CI never built: four 404s and `failed to download llvm from
      # ci`. Unset, it walks back to a real bors commit as it does on the dev
      # host.
      - name: build
        if: steps.have.outputs.build == 'yes'
        run: |
          t0=$(date +%s)
          env -u GITHUB_ACTIONS -u CI cargo run -- --build-only
          echo "BUILD-ONLY-SECONDS: $(( $(date +%s) - t0 ))"
          df -h /

      # `lib/rustlib/<host>` is a symlink into whatever stable toolchain built
      # it, which is not a path any artifact can carry. `Owner::Installed`
      # recreates it.
      - name: publish
        if: steps.have.outputs.build == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          host=x86_64-unknown-linux-gnu
          tar -C rust/build \
              --exclude="x86_64-unknown-toyos/stage2/lib/rustlib/$host" \
              -c "$host/stage2" x86_64-unknown-toyos/stage2 toyos-sysroot-witness \
            | zstd -T0 -3 -o /tmp/toyos-toolchain.tar.zst
          ls -l /tmp/toyos-toolchain.tar.zst
          gh release create "${{ steps.key.outputs.tag }}" \
            --title "${{ steps.key.outputs.tag }}" \
            --notes "x86_64-unknown-linux-gnu toolchain for rust $(git rev-parse HEAD:rust), built from ${{ github.sha }}." \
            /tmp/toyos-toolchain.tar.zst

  guest:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      # `/dev/kvm` is crw-rw---- root:kvm and the runner user is not in the
      # group, so without this every boot takes `-accel kvm` and dies on
      # `failed to initialize kvm: Permission denied`.
      - name: unlock kvm
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qemu-system-x86 ovmf zstd
          qemu-system-x86_64 --version | head -1

      - name: install the toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ needs.toolchain.outputs.tag }}" \
            -p 'toyos-toolchain.tar.zst' -O /tmp/toolchain.tar.zst
          mkdir -p rust/build
          zstd -dc /tmp/toolchain.tar.zst | tar -C rust/build -x
          stage2="$PWD/rust/build/x86_64-unknown-linux-gnu/stage2"
          rustup toolchain link toyos "$stage2"
          "$stage2/bin/rustc" -vV

      - name: suite
        run: |
          cargo test --test toyos-build -- \
            --shard ${{ matrix.shard }}/$SHARDS --jobs 4 --host-slots 0

      - name: keep what a red run leaves
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}-scratch
          path: |
            target/test-durations
            /tmp/toyos-tests-*/**/*.log
            /tmp/toyos-tests-*/**/*.wav
            /tmp/toyos-tests-*/**/*.ppm
          if-no-files-found: ignore
          retention-days: 7

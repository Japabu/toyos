name: ci

# The guest suite on Linux x86_64, four machines at once — which is the shape
# the dev host does not have, and the one that costs nobody a shared sysroot.
#
# `ci/**` is where throwaway probe branches live; they trigger their own
# workflows and not this one.

on:
  push:
    branches-ignore: ['ci/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      # `/dev/kvm` ships as crw-rw---- root:kvm with the runner outside the
      # group, so this chmod is the whole difference between a native guest and
      # an emulated one — `kvm_usable` opens the device and every boot follows.
      # The owner's ruling (`specs/ci-plan.md` §2): everything must work under
      # emulation *and* KVM, and a shard that cannot finish measures nothing.
      # The vendor is printed because it is a variable — an AMD host is the only
      # one that can reproduce the §7 class.
      - name: unlock kvm
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          grep -m1 'model name' /proc/cpuinfo

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qemu-system-x86 ovmf zstd
          qemu-system-x86_64 --version | head -1

      # The same key `toolchain.yml` publishes under. Waited for rather than
      # depended on, because that workflow must survive this one being
      # cancelled — and on nearly every branch the release is already there.
      - name: install the toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=toolchain-linux-x86_64-$(git rev-parse HEAD:rust HEAD:toyos-abi/src \
                HEAD:toyos/src HEAD:userland/libc/src | sha256sum | cut -c1-16)
          echo "toolchain: $tag"
          for _ in $(seq 120); do
            gh release view "$tag" >/dev/null 2>&1 && break
            echo "waiting for the toolchain workflow to publish $tag ..."
            sleep 60
          done
          gh release download "$tag" -p 'toyos-toolchain.tar.zst' \
            -O /tmp/toolchain.tar.zst
          mkdir -p rust/build
          zstd -dc /tmp/toolchain.tar.zst | tar -C rust/build -x
          stage2="$PWD/rust/build/x86_64-unknown-linux-gnu/stage2"
          rustup toolchain link toyos "$stage2"
          "$stage2/bin/rustc" -vV

      # `--host-slots 0`: the semaphore arbitrates between worktrees on one
      # host, and a shard is a host with one suite on it.
      #
      # **`--jobs 2` on four cores, measured.** Run `31233476555` ran `--jobs 4`
      # and the width, not the accelerator, was what was left: every profile
      # boots `-smp 2` and six tests boot `-smp 8`, so four lanes is eight to
      # thirty-two vCPUs on four, and a guest whose kernel spins with `IF` clear
      # pays lock-holder preemption for all of it. The re-run-alone column is the
      # whole argument — `netd_connection_caps` 551 s wide against 6 s alone,
      # `metal_sim_input` 336 s against 4 s, `desktop_locale_detect` 51 s against
      # 4 s. Two lanes and six shards keeps the wall clock and stops the suite
      # measuring the runner.
      - name: suite
        run: |
          cargo test --test toyos-build -- \
            --shard ${{ matrix.shard }}/6 --jobs 2 --host-slots 0

      - name: what a red run left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}-scratch
          path: |
            target/test-durations
            /tmp/toyos-tests-*/
          if-no-files-found: ignore
          retention-days: 7

  # The shards run natively now, so this is the job that keeps the *emulator*
  # exercised: `/dev/kvm` is left as it ships, `kvm_usable` says no, and the
  # guest is TCG on an x86 host. That is not the same machine as the dev host's
  # cross-arch TCG — the owner's rule is that everything works under emulation
  # and under KVM, and a configuration nothing runs is a configuration nobody
  # finds out about. One test, because this is a canary and not a measurement.
  #
  # It is also the arm that keeps `-cpu qemu64` alive: the shards ask for `-cpu
  # host`, so nothing else in CI boots the model the emulated path presents.
  tcg:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: accelerator
        run: |
          ls -l /dev/kvm
          grep -m1 'model name' /proc/cpuinfo

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qemu-system-x86 ovmf zstd

      - name: install the toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=toolchain-linux-x86_64-$(git rev-parse HEAD:rust HEAD:toyos-abi/src \
                HEAD:toyos/src HEAD:userland/libc/src | sha256sum | cut -c1-16)
          for _ in $(seq 90); do
            gh release view "$tag" >/dev/null 2>&1 && break
            echo "waiting for the toolchain workflow to publish $tag ..."
            sleep 60
          done
          gh release download "$tag" -p 'toyos-toolchain.tar.zst' -O /tmp/t.tar.zst
          mkdir -p rust/build
          zstd -dc /tmp/t.tar.zst | tar -C rust/build -x
          rustup toolchain link toyos "$PWD/rust/build/x86_64-unknown-linux-gnu/stage2"

      - name: one test, emulated
        run: cargo test --test toyos-build -- --jobs 1 --host-slots 0 process_stats

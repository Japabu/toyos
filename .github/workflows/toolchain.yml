name: toolchain

# A toolchain is 1.1 GB of product out of an hour of x.py, and it is a function
# of the rust fork plus the three trees that end up inside the sysroot — which
# is `toolchain::witness`'s own question, asked of git so a shell can ask it
# too. Nearly every branch changes none of them and this workflow does nothing.
#
# **Its own workflow because it must never be cancelled.** `ci.yml` cancels a
# superseded run by design; a second push during an hour-long bootstrap would
# throw that hour away and the next run would start it again.

on:
  push:
    branches-ignore: ['ci/**']
  workflow_dispatch:

concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - id: key
        run: |
          sum=$(git rev-parse HEAD:rust HEAD:toyos-abi/src HEAD:toyos/src \
                              HEAD:userland/libc/src | sha256sum | cut -c1-16)
          echo "tag=toolchain-linux-x86_64-$sum" >> "$GITHUB_OUTPUT"

      - id: have
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.key.outputs.tag }}" >/dev/null 2>&1; then
            echo "Already published: ${{ steps.key.outputs.tag }}"
            echo "build=no" >> "$GITHUB_OUTPUT"
          else
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: reclaim runner disk
        if: steps.have.outputs.build == 'yes'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: deps
        if: steps.have.outputs.build == 'yes'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            cmake ninja-build build-essential pkg-config libssl-dev zstd \
            qemu-system-x86 ovmf

      # Full history, deliberately: bootstrap finds the upstream commit whose
      # prebuilt LLVM to download by walking back to the newest bors commit,
      # and a shallow clone has none.
      - name: the rust fork
        if: steps.have.outputs.build == 'yes'
        run: |
          t0=$(date +%s)
          git submodule update --init rust
          echo "SUBMODULE-SECONDS: $(( $(date +%s) - t0 ))"

      # GITHUB_ACTIONS=true puts bootstrap on its own CI path, where it assumes
      # HEAD is a PR merge commit and takes HEAD^1 as the upstream commit whose
      # LLVM to fetch. In this fork HEAD^1 is our own merge of upstream, which
      # rust-lang CI never built: four 404s and `failed to download llvm from
      # ci`. Unset, it walks back to a real bors commit as it does on the dev
      # host.
      - name: build
        if: steps.have.outputs.build == 'yes'
        run: |
          t0=$(date +%s)
          env -u GITHUB_ACTIONS -u CI cargo run -- --build-only
          echo "BUILD-ONLY-SECONDS: $(( $(date +%s) - t0 ))"
          df -h /
          du -sh rust/build

      # `lib/rustlib/<host>` is a symlink into whatever stable toolchain built
      # it, which is not a path any artifact can carry. `Owner::Installed`
      # recreates it.
      - name: publish
        if: steps.have.outputs.build == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          host=x86_64-unknown-linux-gnu
          t0=$(date +%s)
          tar -C rust/build \
              --exclude="x86_64-unknown-toyos/stage2/lib/rustlib/$host" \
              -c "$host/stage2" x86_64-unknown-toyos/stage2 toyos-sysroot-witness \
            | zstd -T0 -3 -o /tmp/toyos-toolchain.tar.zst
          echo "PACKAGE-SECONDS: $(( $(date +%s) - t0 ))"
          ls -l /tmp/toyos-toolchain.tar.zst
          # Idempotent, because the tag *is* the content: two branches carrying
          # the same four trees each build one, and whoever is second would
          # otherwise fail having produced the same bytes.
          gh release create "${{ steps.key.outputs.tag }}" \
            --title "${{ steps.key.outputs.tag }}" \
            --notes "x86_64-unknown-linux-gnu toolchain for rust $(git rev-parse HEAD:rust), built from ${{ github.sha }}." \
            /tmp/toyos-toolchain.tar.zst \
            || gh release view "${{ steps.key.outputs.tag }}"

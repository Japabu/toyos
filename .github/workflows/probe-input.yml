name: input-probe

# Six tests that inject a keystroke or a plug event fail on a runner and pass on
# the dev host in seconds (`specs/known-issues.md` §8). Two things differ and
# neither has been isolated: the accelerator, and QEMU 8.2.2 on the runner
# against 11.0.3 here.
#
# `accel` isolates the first and nothing else: one runner image, one QEMU, one
# commit, one toolchain, one test list, and the only difference between the two
# jobs is whether `/dev/kvm` was chmod'd — which is the whole of the question
# `kvm_usable` asks. That is the §7 method, which settled SYSRET in one run.
#
# `qemu-versions` is the cheap half of the second: it says which container image
# ships which QEMU, so the version arm is a known quantity rather than a guess.
#
# Neither job fails on a red test. The product of a probe is its summary line.

on:
  push:
    branches: ['ci/probe-input']
  workflow_dispatch:

jobs:
  accel:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        accel: [kvm, tcg]
    steps:
      - uses: actions/checkout@v4

      - name: accelerator
        run: |
          if [ "${{ matrix.accel }}" = kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qemu-system-x86 ovmf zstd
          qemu-system-x86_64 --version | head -1
          grep -m1 'model name' /proc/cpuinfo
          nproc

      - name: install the toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=toolchain-linux-x86_64-$(git rev-parse HEAD:rust HEAD:toyos-abi/src \
                HEAD:toyos/src HEAD:userland/libc/src | sha256sum | cut -c1-16)
          for _ in $(seq 90); do
            gh release view "$tag" >/dev/null 2>&1 && break
            echo "waiting for the toolchain workflow to publish $tag ..."
            sleep 60
          done
          gh release download "$tag" -p 'toyos-toolchain.tar.zst' -O /tmp/t.tar.zst
          mkdir -p rust/build
          zstd -dc /tmp/t.tar.zst | tar -C rust/build -x
          rustup toolchain link toyos "$PWD/rust/build/x86_64-unknown-linux-gnu/stage2"

      # One `cargo test` per name because the harness takes one filter, and
      # `--jobs 1` because the question is whether an injected event arrives at
      # all — a width would put contention back into the answer.
      #
      # `abuse_gpu_resolution` is not an input test and is here because it is
      # what killed the 153-test shared boot in run `31241099454`: five tests
      # passed, it went, and every one of the 150 after it timed out.
      - name: one test at a time
        run: |
          red=
          green=
          for t in abuse_gpu_resolution i8042_keyboard i8042_mouse \
                   i8042_fadt_denial metal_sim_pointer_churn xhci_hotplug \
                   xhci_flap desktop_typing_damage; do
            echo "::group::$t (${{ matrix.accel }})"
            if cargo test --test toyos-build -- --jobs 1 --host-slots 0 "$t"; then
              green="$green $t"
            else
              red="$red $t"
            fi
            echo "::endgroup::"
          done
          echo "PROBE-SUMMARY ${{ matrix.accel }} GREEN:$green"
          echo "PROBE-SUMMARY ${{ matrix.accel }} RED:$red"

  # Which image ships which QEMU, so a version arm can be written against a
  # number instead of a hope. The dev host runs 11.0.3 and `ubuntu-24.04` 8.2.2.
  qemu-versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: what each candidate ships
        run: |
          for img in debian:trixie debian:sid ubuntu:25.10 ubuntu:24.04; do
            echo "=== $img"
            docker run --rm "$img" sh -c 'apt-get update -qq >/dev/null 2>&1 && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 \
              >/dev/null 2>&1 && qemu-system-x86_64 --version | head -1' \
              || echo "$img: unavailable"
          done

name: host tests

# Everything that needs no ToyOS toolchain and boots no guest, so it answers
# before the toolchain job has finished restoring one.
#
# macOS because the dev host is macOS and because `toyos-fat32` still builds its
# volumes with `newfs_msdos` and `hdiutil` — the *judge* is ours now
# (`toyos-fat32-check`, written from fatgen103), so that is the only macOS-only
# thing left here and the only reason this job is not on Linux.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: rust
        run: |
          rustc -vV
          cargo -V

      # Cold, this job is 594 s and all of it is compilation. A cache written
      # on `main` is readable from every branch, which is the only reason this
      # helps a branch's first run at all.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            toyos-sched/target
            toyos-ps2/target
            toyos-gpt/target
            toyos-elf/target
            toyos-cc/target
            toyos-ld/target
            toyos-hda/target
            toyos-pci/target
            toyos-xhci/target
            toyos-desktop/target
            kernel-loom/target
            kernel-span/target
            toyos-fat32/target
            toyos-fat32-check/target
            userland/sshd/target
          key: host-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: host-${{ runner.os }}-

      # The build system's own gates: the two lock scopes, the landing
      # protocol, the sysroot witness, and the format check on the two volumes
      # the image builder writes.
      - name: build system
        run: cargo test --lib

      # CLAUDE.md's list, whole. It used to be nine of the thirteen — the four
      # that were missing (`toyos-elf`, `toyos-ld`, `toyos-pci`,
      # `toyos-desktop`) are pure crates whose whole point is that a decision
      # is testable without a guest, so a CI that skipped them skipped exactly
      # the tests it was cheapest to run.
      - name: host crates
        run: |
          set -e
          for crate in toyos-sched toyos-ps2 toyos-gpt toyos-elf toyos-cc \
                       toyos-ld toyos-hda toyos-pci toyos-xhci toyos-desktop \
                       kernel-loom kernel-span toyos-fat32 toyos-fat32-check; do
            echo "=== $crate"
            cargo test --manifest-path "$crate/Cargo.toml"
          done

      # `userland/.cargo/config.toml` cross-compiles by default, so its host
      # tests have to name the host.
      - name: sshd
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo test --manifest-path userland/sshd/Cargo.toml --target "$host"

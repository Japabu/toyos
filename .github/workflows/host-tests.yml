name: host tests

# The host suites (specs/testing-strategy.md §2): everything that needs no
# ToyOS toolchain and boots no guest, so it answers before the toolchain job
# has finished restoring one.
#
# macOS because the dev host is macOS and `toyos-fat32` still builds its
# volumes with `newfs_msdos` and `hdiutil` — the judge is ours now
# (`toyos-fat32-check`), so that is the only macOS-only thing left here.
#
# `03:05 UTC`, five minutes behind `ci.yml`'s `03:00`; `nightly-red.sh`'s
# find-by-title idempotency, not the offset, is what guards against the two
# scheduled runs racing to open the same standing issue.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '5 3 * * *'

# The nightly run gets its own group, same reason as `ci.yml`'s: a push to
# `main` must not be cancelled by, or wait behind, a scheduled run.
concurrency:
  group: host-tests-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: rust
        run: |
          rustc -vV
          cargo -V

      # Cold, this job is 594 s and all of it is compilation. A cache written
      # on `main` is readable from every branch, which is the only reason this
      # helps a branch's first run at all.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            toyos-sched/target
            toyos-ps2/target
            toyos-gpt/target
            toyos-elf/target
            toyos-cc/target
            toyos-ld/target
            toyos-hda/target
            toyos-pci/target
            toyos-xhci/target
            toyos-desktop/target
            kernel-loom/target
            kernel-span/target
            toyos-fat32/target
            toyos-fat32-check/target
            userland/sshd/target
          key: host-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: host-${{ runner.os }}-

      # The build system's own gates: the two lock scopes, the landing
      # protocol, the sysroot witness, and the format check on the two volumes
      # the image builder writes.
      - name: build system
        run: |
          set -o pipefail
          cargo test --lib 2>&1 | tee -a /tmp/host.log

      # Every crate in this repository with host tests. It used to be nine of
      # the thirteen CLAUDE.md's layout names — the four that were missing
      # (`toyos-elf`, `toyos-ld`, `toyos-pci`, `toyos-desktop`) are pure crates
      # whose whole point is that a decision is testable without a guest, so a
      # CI that skipped them skipped exactly the tests it was cheapest to run.
      #
      # **This list is longer than that layout table**, and deliberately: the
      # two `kernel-*` harnesses compile a kernel source file for the host
      # rather than being crates of their own (`kernel-span` for
      # `mm/user_span.rs`, `kernel-elide` for `log/elide.rs`), and each says so
      # in its own manifest. The list to keep current is this one — a harness
      # that runs nowhere is the failure this file exists to prevent.
      - name: host crates
        run: |
          set -e -o pipefail
          for crate in toyos-sched toyos-ps2 toyos-gpt toyos-elf toyos-cc \
                       toyos-ld toyos-hda toyos-pci toyos-xhci toyos-desktop \
                       kernel-loom kernel-span kernel-elide toyos-fat32 \
                       toyos-fat32-check; do
            echo "=== $crate" | tee -a /tmp/host.log
            cargo test --manifest-path "$crate/Cargo.toml" 2>&1 | tee -a /tmp/host.log
          done

      # **`kernel-loom`'s supported matrix is two commands, and the loop above
      # is one of them.** The `loom` feature is default-on and is what makes the
      # crate's atomics loom's instrumented ones; `log_zeroed_init` is about
      # byte-zeroability, which loom's atomics do not have, and `log_body_words`
      # about a message wider than the one word `MSG_WORDS` is under loom. Both
      # are gated `cfg(not(feature = "loom"))`, so the default invocation runs
      # *nothing* from either — which read as a pass for as long as nobody
      # counted.
      #
      # Scoped to those targets rather than the crate:
      # specs/issues/build/kernel-loom-ungated-models-red-without-loom.md
      # records that `tlb_shootdown.rs` reds deterministically under
      # --no-default-features, on main as much as here.
      - name: kernel-loom without loom
        run: |
          set -e -o pipefail
          echo "=== kernel-loom --no-default-features --test log_zeroed_init --test log_body_words" \
            | tee -a /tmp/host.log
          cargo test --manifest-path kernel-loom/Cargo.toml --no-default-features \
            --test log_zeroed_init --test log_body_words 2>&1 | tee -a /tmp/host.log

      # **W3's teeth, run rather than recorded.** `wake-fence-off` removes the
      # two `SeqCst` fences from `shard.rs`'s wake pair and `log_wake` must red
      # under it; a model that has never failed proves nothing, and this is the
      # only obligation in the tree whose *negative* no guest test can express —
      # on x86 a build with either fence gone behaves identically, which is the
      # whole reason it is a model. `specs/log-architecture-spec.md` §2.5.
      - name: kernel-loom wake fences have teeth
        run: |
          set -o pipefail
          echo "=== kernel-loom --features wake-fence-off --test log_wake (must red)" \
            | tee -a /tmp/host.log
          if cargo test --manifest-path kernel-loom/Cargo.toml \
               --features wake-fence-off --test log_wake 2>&1 | tee -a /tmp/host.log; then
            echo "log_wake passed with both fences removed: the model has no teeth" \
              | tee -a /tmp/host.log
            exit 1
          fi

      # `userland/.cargo/config.toml` cross-compiles by default, so a userland
      # crate's host tests have to name the host. `calc` is here for the reason
      # the pure crates above are: its arithmetic is decided without a guest,
      # so a CI that skipped it would skip the cheapest tests it has.
      - name: userland host crates
        run: |
          set -e -o pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          for crate in sshd calc; do
            echo "=== userland/$crate" | tee -a /tmp/host.log
            cargo test --manifest-path "userland/$crate/Cargo.toml" --target "$host" 2>&1 \
              | tee -a /tmp/host.log
          done

      # Sixteen `cargo test` invocations in three steps, and a red is one line
      # somewhere among them; the summary names which crate and the first
      # thing that failed in it.
      - name: failure summary
        if: failure()
        run: |
          {
            echo "### host tests"
            echo ""
            echo '```'
            grep -E '^(=== |error(\[|:)|test .* FAILED|failures:$|    [a-z_:]+$|test result: FAILED)' \
              /tmp/host.log | tail -40 || echo "(nothing matched; read the log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The same standing issue `ci.yml`'s `nightly-red` files or updates. Only on
  # `schedule` — a dispatched run is somebody watching it directly. Named
  # `nightly-red-host`, not `nightly-red`: a job id becomes a check run name,
  # and two jobs sharing one id across workflows would collide under it.
  nightly-red-host:
    needs: [host]
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.host.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: file or update "nightly is red"
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_RESULT: ${{ needs.host.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export TITLE="nightly is red"
          export BODY="Run: $RUN_URL"$'\n'"Failed jobs: host($HOST_RESULT)"
          .github/nightly-red.sh

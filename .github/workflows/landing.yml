name: landing

# The two checks about the landing protocol rather than about the code — rules
# `cargo run -- --land` used to enforce on the dev host, now retired
# (specs/worktrees.md §5), so CI is the only thing left between a branch and
# `main`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A sysroot change may not be merged with the work that depends on it
  # (specs/worktrees.md §3.2): `toyos-abi/src`, `toyos/src` and
  # `userland/libc/src` compile into the one sysroot every worktree builds
  # against, so the sysroot half must land first. The same function answers
  # here and at `cargo run -- --pr`, so a branch that skipped the preflight
  # gets the identical refusal from this check.
  abi-split:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The merge commit, the default: the build system that runs below must
      # be base's own, always current, while `origin/main..HEAD --no-merges`
      # over it is exactly the branch's own commits. General form: a workflow
      # comes from base and the code it runs comes from wherever it checks
      # out, and a job running this repository's own tooling has to take
      # base's.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: landing-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: landing-${{ runner.os }}-

      # Always runs and answers "not a pull request" rather than being
      # skipped: a required check a `push` event skips reports a state a
      # protection rule then has an opinion about.
      - name: the ABI-first rule
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request: this rule is about a branch against its base."
            exit 0
          fi
          git fetch --quiet origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          cargo run -- --abi-split-check --base "origin/${{ github.base_ref }}"

  # What protects `main` is configured outside the repository, and this job
  # reads it back into VCS: half of it is readable from an endpoint that needs
  # no token (specs/ci-plan.md §10.5).
  #
  # The name is fixed: a required-check context is matched by job name, and
  # renaming it is a ruleset change with a window in which a required check
  # reports nothing.
  #
  # A minimum, not an equality: a context required at GitHub that this file
  # does not name is reported, never refused, since an addition must not red
  # every merge until a workflow catches up; a context this file names and
  # GitHub does not is a gate quietly dropped, and that reds.
  gate-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: branch protection
        run: |
          set -eu -o pipefail
          # No `Authorization`: `rules/branches` is readable by anyone who can
          # read the repository, so this asks nothing of the workflow token and
          # cannot start failing because a permission narrowed.
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/rules/branches/main"
          curl -sSL --fail "$api" -o /tmp/rules.json
          jq . /tmp/rules.json

          # Five (specs/testing-strategy.md §4); `tcg` is not one of them —
          # it moved to the nightly schedule (`ci.yml`) and the loop below is
          # a minimum, not an equality, so a `tcg` still required at GitHub is
          # reported rather than refused.
          required="host abi-split gate-stage guest-suite build"
          live=$(jq -r '[.[] | select(.type=="required_status_checks")
                            | .parameters.required_status_checks[].context] | join(" ")' \
                   /tmp/rules.json)
          rules=$(jq -r '[.[].type] | join(" ")' /tmp/rules.json)
          strict=$(jq -r '[.[] | select(.type=="required_status_checks")
                              | .parameters.strict_required_status_checks_policy] | first' \
                     /tmp/rules.json)
          methods=$(jq -r '[.[] | select(.type=="pull_request")
                               | .parameters.allowed_merge_methods[]] | sort | join(",")' \
                      /tmp/rules.json)

          bad=0
          for want in $required; do
            case " $live " in
              *" $want "*) ;;
              *) echo "::error::main does not require the check \`$want\`"; bad=1 ;;
            esac
          done
          for want in deletion non_fast_forward pull_request required_status_checks; do
            case " $rules " in
              *" $want "*) ;;
              *) echo "::error::main has no \`$want\` rule"; bad=1 ;;
            esac
          done
          # Strict is what makes a check on this head a check on the merged
          # result — §10.2, and the property `--land`'s `git merge --no-ff main`
          # used to carry.
          if [ "$strict" != true ]; then
            echo "::error::required checks are not strict, so a branch could merge without"
            echo "::error::containing main and its checks would not be about the merged result"
            bad=1
          fi
          # CLAUDE.md's "never rewrite history", said at the remote.
          [ "$methods" = merge ] \
            || { echo "::error::main allows merge methods \`$methods\`, not just \`merge\`"; bad=1; }

          {
            echo "### what protects main"
            echo ""
            echo "- rules: \`$rules\`"
            echo "- required checks: \`$live\`"
            echo "- strict: \`$strict\`, merge methods: \`$methods\`"
          } >> "$GITHUB_STEP_SUMMARY"
          for have in $live; do
            case " $required " in
              *" $have "*) ;;
              *) echo "- \`$have\` is required at GitHub and not named here" \
                   >> "$GITHUB_STEP_SUMMARY" ;;
            esac
          done

          test "$bad" = 0
          echo "main is protected the way specs/ci-plan.md §10.4 and §10.5 say it is."

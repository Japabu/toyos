name: landing

# The two checks about the landing protocol rather than about the code — rules
# `cargo run -- --land` used to enforce on the dev host, now retired, so CI is
# the only thing left between a branch and `main`.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

# Trusted Linux events select the persistent `toyos` runner. Fork PRs and
# merge-queue refs stay on GitHub-hosted machines.
jobs:
  # A sysroot change may not be merged with the work that depends on it:
  # `toyos-abi/src`, `toyos/src` and `userland/libc/src` compile into the one
  # sysroot every worktree builds against, so the sysroot half must land first.
  # The same function answers here and at `cargo run -- --pr`, so a branch that
  # skipped the preflight gets the identical refusal from this check.
  abi-split:
    runs-on: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'toyos' }}
    timeout-minutes: 20
    steps:
      # The merge commit, the default: the build system that runs below must
      # be base's own, always current, while `origin/main..HEAD --no-merges`
      # over it is exactly the branch's own commits. General form: a workflow
      # comes from base and the code it runs comes from wherever it checks
      # out, and a job running this repository's own tooling has to take
      # base's.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: landing-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: landing-${{ runner.os }}-

      # Always runs and answers "not a pull request" rather than being
      # skipped: a required check a `push` event skips reports a state a
      # protection rule then has an opinion about.
      - name: the ABI-first rule
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request: this rule is about a branch against its base."
            exit 0
          fi
          git fetch --quiet origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          cargo run -- --abi-split-check --base "origin/${{ github.base_ref }}"

  # What protects `main` is configured outside the repository, and this job
  # reads it back into VCS: half of it is readable from an endpoint that needs
  # no token.
  #
  # The name is fixed: a required-check context is matched by job name, and
  # renaming it is a ruleset change with a window in which a required check
  # reports nothing.
  #
  # A minimum, not an equality: a context required at GitHub that this file
  # does not name is reported, never refused, since an addition must not red
  # every merge until a workflow catches up; a context this file names and
  # GitHub does not is a gate quietly dropped, and that reds.
  gate-stage:
    runs-on: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'toyos' }}
    timeout-minutes: 10
    steps:
      - name: branch protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          # Authenticated with the token this job already holds: `rules/branches`
          # needs only `metadata: read`, which every workflow token carries even
          # with no `permissions:` block, so this still asks nothing beyond the
          # default grant and cannot start failing because a permission
          # narrowed. What authenticating buys is the rate limit moving from the
          # runner's shared IP to this run's own quota.
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/rules/branches/main"
          curl -sSL --fail -H "Authorization: Bearer $GH_TOKEN" "$api" -o /tmp/rules.json
          jq . /tmp/rules.json

          # The five required checks, and `tcg` is not one of them —
          # it moved to the nightly schedule (`ci.yml`) and the loop below is
          # a minimum, not an equality, so a `tcg` still required at GitHub is
          # reported rather than refused.
          required="host abi-split gate-stage guest-suite build"
          live=$(jq -r '[.[] | select(.type=="required_status_checks")
                            | .parameters.required_status_checks[].context] | join(" ")' \
                   /tmp/rules.json)
          rules=$(jq -r '[.[].type] | join(" ")' /tmp/rules.json)
          strict=$(jq -r '[.[] | select(.type=="required_status_checks")
                              | .parameters.strict_required_status_checks_policy] | first' \
                     /tmp/rules.json)
          methods=$(jq -r '[.[] | select(.type=="pull_request")
                               | .parameters.allowed_merge_methods[]] | sort | join(",")' \
                      /tmp/rules.json)

          bad=0
          for want in $required; do
            case " $live " in
              *" $want "*) ;;
              *) echo "::error::main does not require the check \`$want\`"; bad=1 ;;
            esac
          done
          for want in deletion non_fast_forward pull_request required_status_checks; do
            case " $rules " in
              *" $want "*) ;;
              *) echo "::error::main has no \`$want\` rule"; bad=1 ;;
            esac
          done
          # What a merge's checks are about is the owner's law, and it eased on
          # 2026-08-20: strict up-to-date branches taxed every landing with one
          # fresh CI cycle for every other open PR, and GitHub's merge queue —
          # the configuration that keeps the merged-result property without the
          # tax — exists only for organization-owned repositories, which this
          # one is not yet. So a branch's checks are its own, `main`'s
          # push-triggered run is the merged-result check, and a red on
          # `main`'s tip is adjudicated at once like any other red. The gate
          # still reads the regime back and reports it; a required merge
          # queue, when the repository can carry one, restores the stronger
          # property for free and this gate already recognises it.
          queued=$(case " $rules " in *" merge_queue "*) echo true;; *) echo false;; esac)
          # CLAUDE.md's "never rewrite history", said at the remote.
          [ "$methods" = merge ] \
            || { echo "::error::main allows merge methods \`$methods\`, not just \`merge\`"; bad=1; }

          {
            echo "### what protects main"
            echo ""
            echo "- rules: \`$rules\`"
            echo "- required checks: \`$live\`"
            echo "- strict: \`$strict\`, merge queue: \`$queued\`, merge methods: \`$methods\`"
          } >> "$GITHUB_STEP_SUMMARY"
          for have in $live; do
            case " $required " in
              *" $have "*) ;;
              *) echo "- \`$have\` is required at GitHub and not named here" \
                   >> "$GITHUB_STEP_SUMMARY" ;;
            esac
          done

          test "$bad" = 0
          echo "main is protected: the five checks above are required (strict=$strict,"
          echo "queue=$queued); merge is the only method, and neither deletion nor a"
          echo "force-push is allowed."

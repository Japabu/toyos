# A member of the host workspace (root `Cargo.toml`), like toyos-pci and
# toyos-userbound: the kernel depends on it by path and its tests run on the
# host. What lives here is which bytes of a value nothing bounds survive the
# line that has to carry it — a seam falling inside a four-byte character costs
# milliseconds to check here and no guest at all, and the tree's own widest
# symbol is under a third of what triggers the elision, so no boot reaches it.
#
# It is a crate rather than a file in `kernel/src` compiled out through a
# `#[path]` attribute, which is what `kernel-elide/` was: a subject that names
# nothing outside itself is a library, and a library has its tests beside its
# code.

[package]
name = "toyos-elide"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

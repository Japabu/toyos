[package]
name = "toyos-cc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
cranelift-codegen = { version = "0.128", default-features = false, features = ["std", "x86", "arm64"] }
cranelift-frontend = "0.128"
cranelift-module = "0.128"
cranelift-object = "0.128"
target-lexicon = { git = "https://github.com/ToyOSOrg/target-lexicon", branch = "toyos" }
toyos-ld = { path = "../toyos-ld" }

# Reading back what the compiler emitted. `tests/emission.rs` is the only
# consumer: that a translation unit compiled says nothing about whether the
# object does what the source asked for.
[dev-dependencies]
object = { version = "0.38", default-features = false, features = ["read", "elf", "std"] }

[lints.rust]
warnings = "deny"

# `[patch.crates-io]` for the `target-lexicon` fork and `[profile.toyos]` used
# to be declared here. Cargo honours neither in a workspace member, and this is
# one — both now live in the root `Cargo.toml`, verbatim, and reach this crate
# from there. `src/hostws.rs` reds on a member that declares either.

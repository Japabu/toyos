[package]
name = "toyos-cc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
cranelift-codegen = { version = "0.128", default-features = false, features = ["std", "x86", "arm64"] }
cranelift-frontend = "0.128"
cranelift-module = "0.128"
cranelift-object = "0.128"
target-lexicon = { git = "https://github.com/Japabu/target-lexicon", branch = "toyos" }
toyos-ld = { path = "../toyos-ld" }

# Reading back what the compiler emitted. `tests/emission.rs` is the only
# consumer: that a translation unit compiled says nothing about whether the
# object does what the source asked for.
[dev-dependencies]
object = { version = "0.38", default-features = false, features = ["read", "elf", "std"] }

[patch.crates-io]
target-lexicon = { git = "https://github.com/Japabu/target-lexicon", branch = "toyos" }

[lints.rust]
warnings = "deny"

# The one profile every guest binary is built with — `specs/plans/boot-image-split.md`
# §6. Optimised, because an unoptimised guest mismeasures everything under TCG;
# debug-assertions and overflow-checks on, because fail-fast beats speed here
# and both crafted-ELF kernel panics in `specs/issues/` were *found* by
# an overflow check. `--release` would turn the last two off silently, so this
# build system no longer has the flag.
[profile.toyos]
inherits = "dev"
opt-level = 2
debug = true
debug-assertions = true
overflow-checks = true

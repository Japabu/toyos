[package]
name = "kernel-loom"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# This package exists only to run the loom model checker over `kernel/src/sync.rs`,
# the ticket spinlock the whole kernel rests on. It compiles that one file into
# its own crate with `feature = "loom"` on, so its atomics and its cell become
# loom-instrumented ones and the model explores the real primitive rather than a
# transliteration of it — a transliteration is exactly the divergence risk a
# model checker is meant to remove.
#
# A separate package, so `loom` and its transitive host crates stay out of
# `kernel/Cargo.lock` — the same arrangement, and the same reason, as
# `toyos-sched/loom`. It sits beside `kernel/` rather than inside it because
# `kernel/.cargo/config.toml` cross-compiles everything below it to
# `x86_64-unknown-none`, and cargo refuses to merge an inherited `build.target`
# away.
#
# The lockfile that isolates loom is no longer this package's own: it is a
# member of the host workspace (root `Cargo.toml`) and resolves in
# `/Cargo.lock`. What matters is unchanged and is what that sentence always
# meant — `kernel/` is *excluded* from that workspace and resolves against
# `kernel/Cargo.lock`, and nothing the kernel builds depends on this package,
# so loom and its transitive crates appear in neither.

[features]
default = ["loom"]
loom = []
# The negative control for W3. It removes the two `SeqCst` fences from
# `shard.rs`'s wake pair, and `log_wake.rs` must red under it — the one command
# that proves the model has teeth:
#
#   cargo test --manifest-path kernel-loom/Cargo.toml --features wake-fence-off \
#     --test log_wake
#
# Never on by default and never reachable from a kernel build, which declares
# the same name only so `cfg` checking knows it.
wake-fence-off = []
# The negative control for the inbox's publication edge. It makes the `tail`
# store and load relaxed, and `inbox.rs` must red under it:
#
#   cargo test --manifest-path kernel-loom/Cargo.toml --features inbox-release-off \
#     --test inbox
#
# Never on by default, and no kernel build can reach it.
inbox-release-off = []

[dependencies]
loom = "0.7"
# The record layout the shard is a ring of. `no_std`, no atomics of its own,
# so it compiles into the model unchanged.
toyos-abi = { path = "../toyos-abi" }

# **The models are compiled with optimisation, and that is a stack decision.**
# `generator`, which loom's coroutines are built on, gives each one 32 KiB —
# and a `LogRecord` is a kilobyte, so a debug build's per-temporary copies of a
# 4,416-byte `Shard` and the records that go through it overflow it before the
# first assertion. Nothing loom checks depends on the optimisation level: its
# atomics and cells are ordinary types whose instrumentation survives inlining,
# and the schedule exploration is loom's own. The optimisation comes from the
# root workspace's `[profile.dev] opt-level = 2` (the `test` profile inherits
# it; a member's own `[profile]` table is ignored by cargo and refused by
# `src/hostws.rs`) — so lowering the root's opt-level does not slow these
# models, it overflows their stacks.

[lib]
path = "src/lib.rs"
# The models are the test targets; loom atomics outside a `loom::model` panic,
# so this crate exposes no unit tests of its own.
test = false
